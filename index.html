<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Овечка-прыгунья</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none;touch-action:none}
body{display:grid;place-items:center}
#game{position:relative;width:min(100vw,56.25vh);height:100dvh;max-width:100vw;overflow:hidden;background:#ddd;touch-action:none}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s ease;pointer-events:none}.bg.active{opacity:1}
#shadow{position:absolute;left:50%;bottom:16.5%;width:26%;height:2.1%;transform:translateX(-50%);border-radius:50%;background:rgba(25,20,15,.2);filter:blur(8px);pointer-events:none}
#sheepWrap{position:absolute;left:50%;bottom:16.7%;width:43%;transform:translateX(-50%);transform-origin:50% 100%;will-change:transform;pointer-events:none}
#sheep{display:block;width:100%;height:auto;transform-origin:50% 100%;filter:drop-shadow(0 8px 6px rgba(0,0,0,.12));will-change:transform}
.hint{position:absolute;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:7px 11px;border-radius:999px;color:#fff;background:rgba(10,10,10,.35);font-size:13px;white-space:nowrap;backdrop-filter:blur(8px)}
.controls{position:absolute;z-index:10;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:12px;padding:0 14px}
.btn{height:clamp(72px,11vh,92px);border:0;border-radius:24px;color:#fff;font-size:clamp(34px,8vw,46px);font-weight:800;background:rgba(20,20,20,.58);box-shadow:inset 0 0 0 1px rgba(255,255,255,.24),0 7px 20px rgba(0,0,0,.2);backdrop-filter:blur(10px);touch-action:manipulation}.btn:active{transform:scale(.96);background:rgba(20,20,20,.75)}#jumpBtn{font-size:clamp(38px,9vw,52px);background:rgba(20,20,20,.68)}
</style>
</head>
<body>
<div id="game">
<img class="bg active" id="bg0" src="assets/farm.webp" alt="">
<img class="bg" id="bg1" src="assets/room.webp" alt="">
<div id="shadow"></div>
<div id="sheepWrap"><img id="sheep" src="assets/sheep.webp" alt="Овечка"></div>
<div class="hint">Тапай кнопки снизу 🐑</div>
<div class="controls"><button class="btn" id="leftBtn" aria-label="Предыдущий фон">←</button><button class="btn" id="jumpBtn" aria-label="Прыжок">↑</button><button class="btn" id="rightBtn" aria-label="Следующий фон">→</button></div>
</div>
<script>
(()=>{
const game=document.getElementById('game'),wrap=document.getElementById('sheepWrap'),sheep=document.getElementById('sheep'),shadow=document.getElementById('shadow'),bgs=[document.getElementById('bg0'),document.getElementById('bg1')];
let bgIndex=0,phase='idle',phaseT=0,y=0,vy=0,last=performance.now();const G=1850,V=735;
function setBg(i){bgIndex=(i+bgs.length)%bgs.length;bgs.forEach((b,n)=>b.classList.toggle('active',n===bgIndex))}
function jump(){if(phase!=='idle')return;phase='anticipation';phaseT=0}
function bind(id,fn){const el=document.getElementById(id);let touched=0;el.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();touched=Date.now();fn()},{passive:false});el.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')return;e.preventDefault();e.stopPropagation();fn()});el.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();if(Date.now()-touched<700)return;fn()})}
bind('leftBtn',()=>setBg(bgIndex-1));bind('jumpBtn',jump);bind('rightBtn',()=>setBg(bgIndex+1));
function update(dt){phaseT+=dt;if(phase==='anticipation'){const p=Math.min(1,phaseT/.105),k=Math.sin(p*Math.PI);sheep.style.transform=`scale(${1+.055*k},${1-.075*k}) translateY(${2.5*k}px)`;if(p>=1){phase='air';phaseT=0;vy=V;sheep.style.transform=''}}if(phase==='air'){vy-=G*dt;y+=vy*dt;if(y<=0){y=0;vy=0;phase='landing';phaseT=0}}if(phase==='landing'){const p=Math.min(1,phaseT/.16),k=Math.sin(p*Math.PI);sheep.style.transform=`scale(${1+.065*k},${1-.055*k})`;if(p>=1){phase='idle';phaseT=0;sheep.style.transform=''}}const s=game.clientHeight/960,lift=y*s,rot=phase==='air'?Math.max(-2.3,Math.min(2.3,-vy/315)):0;wrap.style.transform=`translateX(-50%) translateY(${-lift}px) rotate(${rot}deg)`;if(phase==='air'){const speed=Math.min(1,Math.abs(vy)/V);sheep.style.transform=`scale(${1-.022*speed},${1+.033*speed})`}const hh=Math.min(1,y/145),ss=1-.38*hh;shadow.style.transform=`translateX(-50%) scale(${ss})`;shadow.style.opacity=String(.2*(1-.67*hh))}
function loop(now){const dt=Math.min(1/30,(now-last)/1000);last=now;update(dt);requestAnimationFrame(loop)}requestAnimationFrame(loop);
let sceneTouch=0;game.addEventListener('touchstart',e=>{if(e.target.closest('button'))return;e.preventDefault();sceneTouch=Date.now();jump()},{passive:false});game.addEventListener('click',e=>{if(e.target.closest('button'))return;if(Date.now()-sceneTouch<700)return;jump()});
})();
</script>
</body>
</html>
