<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Овечка</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none;touch-action:none}
body{display:grid;place-items:center}
#game{position:relative;width:min(100vw,56.25vh);height:100dvh;max-width:100vw;overflow:hidden;background:#b9db86;touch-action:none}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
#shadow{position:absolute;left:50%;bottom:18.8%;width:24%;height:2.2%;transform:translateX(-50%);border-radius:50%;background:rgba(30,20,10,.18);filter:blur(8px);pointer-events:none;transition:opacity .15s,transform .15s}
#sheepWrap{position:absolute;left:50%;bottom:19.1%;width:43%;aspect-ratio:700/937;transform:translateX(-50%);transform-origin:50% 100%;will-change:transform;pointer-events:none;z-index:3}
.layer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;pointer-events:none;filter:drop-shadow(0 8px 6px rgba(0,0,0,.10))}
#body{clip-path:inset(43% 0 0 0);transform-origin:50% 100%;will-change:transform}
#head{clip-path:inset(0 0 44% 0);transform-origin:51% 44%;will-change:transform;transition:transform .18s ease}
#sheepWrap.look-up #head{transform:translateY(-1.8%) rotate(-10deg)}
#sheepWrap.look-down #head{transform:translateY(4%) rotate(11deg)}
#sheepWrap.chewing #head{animation:chew .16s ease-in-out 6}
#sheepWrap.pet-react #head{animation:nuzzle .9s ease-in-out 1}
#sheepWrap.feed-react #head{animation:feedNuzzle .9s ease-in-out 1}
@keyframes chew{0%,100%{transform:none}50%{transform:translateY(1.4%) rotate(1.8deg) scaleY(.985)}}
@keyframes nuzzle{0%,100%{transform:none}28%{transform:translate(5%,-1%) rotate(-6deg)}58%{transform:translate(6%,1%) rotate(-4deg)}}
@keyframes feedNuzzle{0%,100%{transform:none}30%{transform:translate(-4%,-1%) rotate(-6deg)}62%{transform:translate(-5%,1%) rotate(-3deg)}}
#feedScene,#petScene{position:absolute;inset:0;pointer-events:none;z-index:5}
.armWrap{position:absolute;width:54%;height:13%;opacity:0;transform-origin:center center}
.armSvg{width:100%;height:100%;overflow:visible}
#feedArm{left:-46%;top:56%}
#petArm{right:-46%;top:46%;transform:scaleX(-1)}
#feedScene.active #feedArm{animation:feedIn 2.15s ease-in-out forwards}
#petScene.active #petArm{animation:petIn 2.2s ease-in-out forwards}
@keyframes feedIn{0%{opacity:0;transform:translateX(-8%)}18%{opacity:1}38%,72%{opacity:1;transform:translateX(84%)}100%{opacity:0;transform:translateX(-8%)}}
@keyframes petIn{0%{opacity:0;transform:scaleX(-1) translateX(0)}18%{opacity:1}36%,76%{opacity:1;transform:scaleX(-1) translateX(82%)}100%{opacity:0;transform:scaleX(-1) translateX(0)}}
.handPalm{fill:#efc1a0}.finger{fill:#efc1a0}.armSkin{fill:#e8ba98}.sleeve{fill:#c5d4ef}.sleeve2{fill:#9ab1dd}
#carrotGroup{transform-origin:365px 58px;transition:transform .18s ease,opacity .18s ease}
#feedScene.bitten #carrotGroup{opacity:0;transform:translateX(22px) scale(.22) rotate(8deg)}
#petHandGroup{transform-origin:365px 58px}
#petScene.active #petHandGroup{animation:pat .36s ease-in-out 4 .62s}
@keyframes pat{0%,100%{transform:rotate(0deg) translateY(0)}50%{transform:rotate(-7deg) translateY(10px)}}
.hint{position:absolute;z-index:9;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:7px 11px;border-radius:999px;color:#fff;background:rgba(10,10,10,.30);font-size:12px;white-space:nowrap;backdrop-filter:blur(8px)}
.controls{position:absolute;z-index:15;left:50%;bottom:max(10px,env(safe-area-inset-bottom));width:min(58vw,230px);aspect-ratio:1.45/1;transform:translateX(-50%)}
.btn{position:absolute;width:31%;aspect-ratio:1;border:0;border-radius:28%;color:#fff;font-size:clamp(28px,7vw,40px);font-weight:800;background:rgba(20,20,20,.58);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),0 6px 18px rgba(0,0,0,.18);backdrop-filter:blur(10px);touch-action:manipulation}
.btn:active{transform:scale(.94);background:rgba(20,20,20,.76)}
#upBtn{left:34.5%;top:0}#downBtn{left:34.5%;bottom:0}#leftBtn{left:0;bottom:0}#rightBtn{right:0;bottom:0}
</style>
</head>
<body>
<div id="game">
  <img id="bg" src="assets/farm.webp" alt="">
  <div id="shadow"></div>
  <div id="sheepWrap">
    <img id="body" class="layer" src="assets/sheep.webp" alt="">
    <img id="head" class="layer" src="assets/sheep.webp" alt="Овечка">
  </div>

  <div id="feedScene">
    <div id="feedArm" class="armWrap">
      <svg class="armSvg" viewBox="0 0 460 120" aria-hidden="true">
        <rect class="sleeve" x="0" y="28" width="108" height="56" rx="28"/>
        <rect class="sleeve2" x="90" y="28" width="26" height="56" rx="13"/>
        <rect class="armSkin" x="106" y="34" width="226" height="44" rx="22"/>
        <g id="feedHandGroup">
          <ellipse class="handPalm" cx="352" cy="56" rx="28" ry="22"/>
          <ellipse class="finger" cx="372" cy="40" rx="9" ry="13" transform="rotate(14 372 40)"/>
          <ellipse class="finger" cx="384" cy="49" rx="9" ry="13" transform="rotate(10 384 49)"/>
          <ellipse class="finger" cx="388" cy="61" rx="9" ry="13" transform="rotate(4 388 61)"/>
          <ellipse class="finger" cx="382" cy="73" rx="9" ry="13" transform="rotate(-6 382 73)"/>
          <ellipse class="finger" cx="338" cy="73" rx="10" ry="16" transform="rotate(-48 338 73)"/>
        </g>
        <g id="carrotGroup">
          <path d="M387 55 C408 41 440 41 452 55 C440 70 408 70 387 55 Z" fill="#f27f23"/>
          <path d="M389 55 L364 57 L389 66 Z" fill="#e36415"/>
          <path d="M452 55 L456 56 L452 58 Z" fill="#c95a10"/>
          <path d="M362 57 C350 41 352 31 370 22 C372 38 377 47 389 55 Z" fill="#5faa41"/>
          <path d="M364 57 C349 55 342 43 345 28 C358 37 369 44 389 55 Z" fill="#76c957"/>
          <path d="M364 57 C353 68 350 79 359 91 C371 77 378 69 389 57 Z" fill="#68b84a"/>
        </g>
      </svg>
    </div>
  </div>

  <div id="petScene">
    <div id="petArm" class="armWrap">
      <svg class="armSvg" viewBox="0 0 460 120" aria-hidden="true">
        <rect class="sleeve" x="0" y="28" width="108" height="56" rx="28"/>
        <rect class="sleeve2" x="90" y="28" width="26" height="56" rx="13"/>
        <rect class="armSkin" x="106" y="34" width="226" height="44" rx="22"/>
        <g id="petHandGroup">
          <ellipse class="handPalm" cx="352" cy="56" rx="28" ry="22"/>
          <ellipse class="finger" cx="372" cy="40" rx="9" ry="13" transform="rotate(14 372 40)"/>
          <ellipse class="finger" cx="384" cy="49" rx="9" ry="13" transform="rotate(10 384 49)"/>
          <ellipse class="finger" cx="388" cy="61" rx="9" ry="13" transform="rotate(4 388 61)"/>
          <ellipse class="finger" cx="382" cy="73" rx="9" ry="13" transform="rotate(-6 382 73)"/>
          <ellipse class="finger" cx="338" cy="73" rx="10" ry="16" transform="rotate(-48 338 73)"/>
        </g>
      </svg>
    </div>
  </div>

  <div class="hint">↑ прыжок · ↓ присесть · ← морковка · → гладить</div>
  <div class="controls">
    <button class="btn" id="upBtn" aria-label="Прыгнуть">↑</button>
    <button class="btn" id="leftBtn" aria-label="Дать морковку">←</button>
    <button class="btn" id="downBtn" aria-label="Присесть">↓</button>
    <button class="btn" id="rightBtn" aria-label="Погладить">→</button>
  </div>
</div>
<script>
(()=>{
const game=document.getElementById('game'),wrap=document.getElementById('sheepWrap'),body=document.getElementById('body'),shadow=document.getElementById('shadow');
const feedScene=document.getElementById('feedScene'),petScene=document.getElementById('petScene');
let mode='idle',y=0,vy=0,last=performance.now();
const G=1900,V=760,timers=[];let audioCtx=null;
const later=(fn,ms)=>{const id=setTimeout(fn,ms);timers.push(id);return id};
function clearTimers(){while(timers.length)clearTimeout(timers.pop())}
function clearLook(){wrap.classList.remove('look-up','look-down','chewing','pet-react','feed-react')}
function finish(){clearTimers();mode='idle';y=0;vy=0;wrap.style.transform='translateX(-50%)';body.style.transform='';clearLook();shadow.style.opacity='.18';shadow.style.transform='translateX(-50%)';feedScene.classList.remove('active','bitten');petScene.classList.remove('active')}
function busy(){return mode!=='idle'}
function jump(){if(busy())return;mode='jump';clearLook();wrap.classList.add('look-up');body.animate([{transform:'scale(1.05,.92)'},{transform:'scale(.98,1.03)'}],{duration:150,easing:'ease-out'});later(()=>{vy=V;mode='air'},110)}
function crouch(){if(busy())return;mode='crouch';clearLook();wrap.classList.add('look-down');wrap.animate([{transform:'translateX(-50%) scale(1,1)'},{transform:'translateX(-50%) translateY(8%) scale(1.05,.82)'},{transform:'translateX(-50%) translateY(8%) scale(1.05,.82)'},{transform:'translateX(-50%) scale(1,1)'}],{duration:760,easing:'ease-in-out'});later(finish,770)}
function crunchSound(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume();const now=audioCtx.currentTime;for(let i=0;i<4;i++){const src=audioCtx.createBufferSource();const len=Math.floor(audioCtx.sampleRate*0.05);const buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate);const data=buf.getChannelData(0);for(let j=0;j<len;j++)data[j]=(Math.random()*2-1)*Math.exp(-j/900);src.buffer=buf;const bp=audioCtx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1400-i*180;bp.Q.value=1.2;const gain=audioCtx.createGain();gain.gain.setValueAtTime(0.0001,now+i*0.05);gain.gain.exponentialRampToValueAtTime(0.16,now+i*0.05+0.004);gain.gain.exponentialRampToValueAtTime(0.0001,now+i*0.05+0.06);src.connect(bp);bp.connect(gain);gain.connect(audioCtx.destination);src.start(now+i*0.05);src.stop(now+i*0.05+0.07)}}
function feed(){if(busy())return;mode='feed';clearLook();feedScene.classList.remove('active','bitten');void feedScene.offsetWidth;feedScene.classList.add('active');later(()=>wrap.classList.add('feed-react'),620);later(()=>{wrap.classList.remove('feed-react');wrap.classList.add('chewing');feedScene.classList.add('bitten');crunchSound()},860);later(finish,2200)}
function pet(){if(busy())return;mode='pet';clearLook();petScene.classList.remove('active');void petScene.offsetWidth;petScene.classList.add('active');later(()=>wrap.classList.add('pet-react'),620);later(finish,2200)}
function bind(id,fn){const el=document.getElementById(id);let touched=0;el.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();touched=Date.now();fn()},{passive:false});el.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')return;e.preventDefault();e.stopPropagation();fn()});el.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();if(Date.now()-touched<700)return;fn()})}
bind('upBtn',jump);bind('downBtn',crouch);bind('leftBtn',feed);bind('rightBtn',pet);
function update(dt){if(mode==='air'){vy-=G*dt;y+=vy*dt;if(vy<80)wrap.classList.remove('look-up');if(y<=0){y=0;vy=0;mode='land';body.animate([{transform:'scale(1.08,.88)'},{transform:'scale(1,1)'}],{duration:180,easing:'ease-out'});later(finish,190)}}const scale=game.clientHeight/960,lift=y*scale;wrap.style.transform=`translateX(-50%) translateY(${-lift}px)`;const hh=Math.min(1,y/150),ss=1-.40*hh;shadow.style.transform=`translateX(-50%) scale(${ss})`;shadow.style.opacity=String(.18*(1-.72*hh))}
function loop(now){const dt=Math.min(1/30,(now-last)/1000);last=now;update(dt);requestAnimationFrame(loop)}requestAnimationFrame(loop);
window.addEventListener('keydown',e=>{if(e.code==='ArrowUp')jump();else if(e.code==='ArrowDown')crouch();else if(e.code==='ArrowLeft')feed();else if(e.code==='ArrowRight')pet()});
})();
</script>
</body>
</html>
