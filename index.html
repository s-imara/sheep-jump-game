<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Овечка</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none;touch-action:none}
body{display:grid;place-items:center}
#game{position:relative;width:min(100vw,56.25vh);height:100dvh;max-width:100vw;overflow:hidden;background:#b9db86;touch-action:none}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
#shadow{position:absolute;left:50%;bottom:19.1%;width:25%;height:2.2%;transform:translateX(-50%);border-radius:50%;background:rgba(25,20,15,.18);filter:blur(8px);pointer-events:none;transition:opacity .15s,transform .15s}
#sheepWrap{position:absolute;left:50%;bottom:19.4%;width:46%;aspect-ratio:700/937;transform:translateX(-50%);transform-origin:50% 100%;will-change:transform;pointer-events:none;z-index:3}
.layer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;filter:drop-shadow(0 7px 5px rgba(0,0,0,.10));pointer-events:none}
#body{clip-path:inset(42% 0 0 0);transform-origin:50% 100%;will-change:transform}
#head{clip-path:inset(0 0 44% 0);transform-origin:51% 48%;will-change:transform;transition:transform .16s ease}
#sheepWrap.look-up #head{transform:translateY(-1.5%) rotate(-9deg)}
#sheepWrap.look-down #head{transform:translateY(3.5%) rotate(10deg)}
#sheepWrap.pet-react #head{animation:nuzzle .9s ease-in-out 1}
#sheepWrap.chewing #head{animation:chew .15s ease-in-out 6}
@keyframes nuzzle{0%,100%{transform:none}28%{transform:translate(3%,-1%) rotate(-6deg)}58%{transform:translate(4%,1%) rotate(-4deg)}}
@keyframes chew{0%,100%{transform:none}50%{transform:translateY(1.6%) rotate(1.8deg) scaleY(.985)}}
#feedScene,#petScene{position:absolute;inset:0;pointer-events:none;z-index:5}
#feedArm{position:absolute;left:-46%;top:61%;width:53%;height:7.5%;opacity:0}
#feedArm .forearm{position:absolute;left:0;top:28%;width:82%;height:42%;border-radius:999px;background:linear-gradient(#f3c9a9,#dda783);box-shadow:inset 0 -3px 0 rgba(130,75,45,.10)}
#feedArm .hand{position:absolute;right:2%;top:4%;width:25%;aspect-ratio:1/1;border-radius:48% 52% 50% 45%;background:linear-gradient(145deg,#f6cfb1,#dba17b);transform:rotate(-11deg)}
#carrot{position:absolute;right:-18%;top:30%;width:35%;height:30%;transform-origin:10% 50%;transform:rotate(-4deg);transition:opacity .16s,transform .22s}
#carrot .root{position:absolute;left:18%;top:18%;width:74%;height:62%;background:linear-gradient(90deg,#ff9a2f,#ef6d17);clip-path:polygon(0 20%,100% 0,100% 100%,0 80%);border-radius:50% 24% 24% 50%}
#carrot .leaf{position:absolute;left:0;top:-10%;width:28%;height:120%;background:#5ba947;border-radius:100% 15% 100% 15%;transform-origin:100% 50%}.l2{transform:rotate(40deg) scale(.82)}.l3{transform:rotate(-38deg) scale(.72)}
#feedScene.active #feedArm{animation:feedIn 2.2s ease-in-out forwards}
#feedScene.bitten #carrot{opacity:0;transform:translateX(18%) scale(.18) rotate(4deg)}
@keyframes feedIn{0%{opacity:0;transform:translateX(-4%)}18%{opacity:1}38%,72%{opacity:1;transform:translateX(99%)}100%{opacity:0;transform:translateX(-4%)}}
#petArm{position:absolute;right:-48%;top:48%;width:55%;height:8.5%;opacity:0}
#petArm .forearm{position:absolute;right:0;top:28%;width:84%;height:42%;border-radius:999px;background:linear-gradient(#f3c9a9,#dda783);box-shadow:inset 0 -3px 0 rgba(130,75,45,.10)}
#petArm .hand{position:absolute;left:0;top:0;width:24%;aspect-ratio:1/.82;border-radius:52% 48% 55% 48%;background:linear-gradient(145deg,#f6cfb1,#dba17b);transform:rotate(16deg);transform-origin:70% 50%}
#petScene.active #petArm{animation:petIn 2.25s ease-in-out forwards}
#petScene.active #petArm .hand{animation:pat .34s ease-in-out 4 .62s}
@keyframes petIn{0%{opacity:0;transform:translateX(0)}20%{opacity:1}35%,78%{opacity:1;transform:translateX(-92%)}100%{opacity:0;transform:translateX(0)}}
@keyframes pat{0%,100%{transform:rotate(16deg) translateY(0)}50%{transform:rotate(7deg) translateY(13%)}}
.hint{position:absolute;z-index:9;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:7px 11px;border-radius:999px;color:#fff;background:rgba(10,10,10,.30);font-size:12px;white-space:nowrap;backdrop-filter:blur(8px)}
.controls{position:absolute;z-index:15;left:50%;bottom:max(10px,env(safe-area-inset-bottom));width:min(58vw,230px);aspect-ratio:1.45/1;transform:translateX(-50%)}
.btn{position:absolute;width:31%;aspect-ratio:1;border:0;border-radius:28%;color:#fff;font-size:clamp(28px,7vw,40px);font-weight:800;background:rgba(20,20,20,.58);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),0 6px 18px rgba(0,0,0,.18);backdrop-filter:blur(10px);touch-action:manipulation}
.btn:active{transform:scale(.94);background:rgba(20,20,20,.76)}
#upBtn{left:34.5%;top:0}#downBtn{left:34.5%;bottom:0}#leftBtn{left:0;bottom:0}#rightBtn{right:0;bottom:0}
</style>
</head>
<body>
<div id="game">
  <img id="bg" src="assets/farm.webp" alt="">
  <div id="shadow"></div>
  <div id="sheepWrap">
    <img id="body" class="layer" src="assets/sheep-clean.webp" alt="">
    <img id="head" class="layer" src="assets/sheep-clean.webp" alt="Овечка">
  </div>
  <div id="feedScene"><div id="feedArm"><div class="forearm"></div><div class="hand"></div><div id="carrot"><i class="leaf l1"></i><i class="leaf l2"></i><i class="leaf l3"></i><i class="root"></i></div></div></div>
  <div id="petScene"><div id="petArm"><div class="forearm"></div><div class="hand"></div></div></div>
  <div class="hint">↑ прыжок · ↓ присесть · ← морковка · → гладить</div>
  <div class="controls">
    <button class="btn" id="upBtn" aria-label="Прыгнуть">↑</button>
    <button class="btn" id="leftBtn" aria-label="Дать морковку">←</button>
    <button class="btn" id="downBtn" aria-label="Присесть">↓</button>
    <button class="btn" id="rightBtn" aria-label="Погладить">→</button>
  </div>
</div>
<script>
(()=>{
const game=document.getElementById('game'),wrap=document.getElementById('sheepWrap'),body=document.getElementById('body'),shadow=document.getElementById('shadow'),feedScene=document.getElementById('feedScene'),petScene=document.getElementById('petScene');
let mode='idle',y=0,vy=0,last=performance.now();const G=1900,V=760;let audioCtx=null;
function busy(){return mode!=='idle'}
function clearLook(){wrap.classList.remove('look-up','look-down','chewing','pet-react')}
function finish(){mode='idle';y=0;vy=0;wrap.style.transform='translateX(-50%)';body.style.transform='';clearLook();shadow.style.opacity='.18';shadow.style.transform='translateX(-50%)'}
function unlockAudio(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
function playCrunch(){if(!audioCtx)return;const now=audioCtx.currentTime;[0,.17,.34].forEach((off,i)=>{const len=Math.floor(audioCtx.sampleRate*(.095-i*.012));const b=audioCtx.createBuffer(1,len,audioCtx.sampleRate),d=b.getChannelData(0);for(let n=0;n<len;n++){const env=Math.exp(-n/(len*.22));d[n]=(Math.random()*2-1)*env*(.8-i*.12)}const src=audioCtx.createBufferSource(),f=audioCtx.createBiquadFilter(),g=audioCtx.createGain();f.type='bandpass';f.frequency.value=1700+i*350;f.Q.value=.7;g.gain.value=.42;src.buffer=b;src.connect(f).connect(g).connect(audioCtx.destination);src.start(now+off)})}
function jump(){if(busy())return;unlockAudio();mode='prep';wrap.classList.add('look-up');body.animate([{transform:'scale(1.04,.93)'},{transform:'scale(.98,1.03)'}],{duration:135,easing:'ease-out'});setTimeout(()=>{if(mode==='prep'){vy=V;mode='air'}},105)}
function crouch(){if(busy())return;mode='crouch';wrap.classList.add('look-down');wrap.animate([{transform:'translateX(-50%) scale(1)'},{transform:'translateX(-50%) translateY(8%) scale(1.05,.82)'},{transform:'translateX(-50%) translateY(8%) scale(1.05,.82)'},{transform:'translateX(-50%) scale(1)'}],{duration:760,easing:'ease-in-out'});setTimeout(finish,770)}
function feed(){if(busy())return;unlockAudio();mode='feed';feedScene.classList.remove('active','bitten');void feedScene.offsetWidth;feedScene.classList.add('active');setTimeout(()=>{wrap.classList.add('chewing');feedScene.classList.add('bitten');playCrunch()},820);setTimeout(()=>{feedScene.classList.remove('active','bitten');finish()},2200)}
function pet(){if(busy())return;mode='pet';petScene.classList.remove('active');void petScene.offsetWidth;petScene.classList.add('active');setTimeout(()=>wrap.classList.add('pet-react'),620);setTimeout(()=>{petScene.classList.remove('active');finish()},2280)}
function bind(id,fn){const el=document.getElementById(id);let touched=0;el.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();touched=Date.now();fn()},{passive:false});el.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')return;e.preventDefault();e.stopPropagation();fn()});el.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();if(Date.now()-touched<700)return;fn()})}
bind('upBtn',jump);bind('downBtn',crouch);bind('leftBtn',feed);bind('rightBtn',pet);
function update(dt){if(mode==='air'){vy-=G*dt;y+=vy*dt;if(vy<80)wrap.classList.remove('look-up');if(y<=0){y=0;vy=0;mode='land';body.animate([{transform:'scale(1.08,.88)'},{transform:'scale(1)'}],{duration:180,easing:'ease-out'});setTimeout(finish,190)}}const scale=game.clientHeight/960,lift=y*scale;wrap.style.transform=`translateX(-50%) translateY(${-lift}px)`;const hh=Math.min(1,y/150),ss=1-.40*hh;shadow.style.transform=`translateX(-50%) scale(${ss})`;shadow.style.opacity=String(.18*(1-.72*hh))}
function loop(now){const dt=Math.min(1/30,(now-last)/1000);last=now;update(dt);requestAnimationFrame(loop)}requestAnimationFrame(loop);
window.addEventListener('keydown',e=>{if(e.code==='ArrowUp')jump();else if(e.code==='ArrowDown')crouch();else if(e.code==='ArrowLeft')feed();else if(e.code==='ArrowRight')pet()});
})();
</script>
</body>
</html>
